# CI: run the offline test suite on every push and pull request.
# No live FRINK calls. The tests use only the included sample run.
# This is why the install step matters: `python -m unittest discover`
# fails with ModuleNotFoundError unless the package is installed first
# (or PYTHONPATH=src is set). Verified locally: 16 tests, 0.034s.
#
# Python 3.9 was dropped from CI on 2026-11-17, not because the code
# stopped working on it (pyproject still says >=3.9), but because
# GitHub's ubuntu-latest runner is now Ubuntu 26.04, and
# actions/setup-python has no 3.9 build for it (3.9 reached
# end-of-life in October 2025). Pinning to ubuntu-24.04 keeps the
# remaining versions stable instead of moving with ubuntu-latest.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLI
        run: |
          ocm --version
          ocm --help
          ocm paths --help
