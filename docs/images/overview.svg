<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/>
    </marker>
  </defs>
  <g font-size="13" fill="#1f2933">
    <!-- sources -->
    <rect x="20" y="40" width="160" height="60" rx="8" fill="#eef2f7" stroke="#9aa5b1"/>
    <text x="100" y="66" text-anchor="middle" font-weight="bold">MCP-OKN catalog</text>
    <text x="100" y="85" text-anchor="middle">verified crosswalks</text>
    <rect x="20" y="190" width="160" height="60" rx="8" fill="#eef2f7" stroke="#9aa5b1"/>
    <text x="100" y="216" text-anchor="middle" font-weight="bold">FRINK federation</text>
    <text x="100" y="235" text-anchor="middle">SPARQL · KGF · okn-void</text>
    <!-- steps -->
    <rect x="230" y="115" width="150" height="70" rx="8" fill="#e3f0fb" stroke="#1f6fb2"/>
    <text x="305" y="140" text-anchor="middle" font-weight="bold">1 · Read once</text>
    <text x="305" y="158" text-anchor="middle">each graph's</text>
    <text x="305" y="174" text-anchor="middle">identifiers</text>
    <rect x="420" y="115" width="150" height="70" rx="8" fill="#e3f0fb" stroke="#1f6fb2"/>
    <text x="495" y="140" text-anchor="middle" font-weight="bold">2 · Standardize</text>
    <text x="495" y="158" text-anchor="middle">MONDO_0004979 →</text>
    <text x="495" y="174" text-anchor="middle">MONDO:0004979</text>
    <rect x="610" y="115" width="150" height="70" rx="8" fill="#e3f0fb" stroke="#1f6fb2"/>
    <text x="685" y="140" text-anchor="middle" font-weight="bold">3 · Compare</text>
    <text x="685" y="158" text-anchor="middle">every pair, direct</text>
    <text x="685" y="174" text-anchor="middle">and via Ubergraph</text>
    <rect x="800" y="40" width="180" height="70" rx="8" fill="#fff4e0" stroke="#c77d00"/>
    <text x="890" y="65" text-anchor="middle" font-weight="bold">Check vs catalog</text>
    <text x="890" y="83" text-anchor="middle">confirmed · missing ·</text>
    <text x="890" y="99" text-anchor="middle">refused but connected</text>
    <rect x="800" y="190" width="180" height="70" rx="8" fill="#e6f4ea" stroke="#2e7d32"/>
    <text x="890" y="215" text-anchor="middle" font-weight="bold">Serve with evidence</text>
    <text x="890" y="233" text-anchor="middle">find_join_paths (MCP)</text>
    <text x="890" y="249" text-anchor="middle">reports · draft entries</text>
  </g>
  <g stroke="#5f6b7a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M180,70 C210,70 210,140 228,145"/>
    <path d="M180,220 C210,220 210,160 228,155"/>
    <path d="M380,150 L418,150"/>
    <path d="M570,150 L608,150"/>
    <path d="M760,140 C780,120 780,80 798,76"/>
    <path d="M760,160 C780,180 780,220 798,224"/>
  </g>
  <text x="305" y="215" font-size="11" fill="#5f6b7a" text-anchor="middle">query patterns reused from</text>
  <text x="305" y="229" font-size="11" fill="#5f6b7a" text-anchor="middle">verified crosswalks · read-only</text>
  <text x="685" y="215" font-size="11" fill="#5f6b7a" text-anchor="middle">tagged with each graph's release</text>
</svg>
